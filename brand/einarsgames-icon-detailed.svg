<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 108 112">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb685"/><stop offset=".45" stop-color="#ff7a45"/><stop offset="1" stop-color="#e2461c"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8360f"/><stop offset="1" stop-color="#7d2108"/></linearGradient>
    <radialGradient id="light" cx="28%" cy="22%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe7d8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".5" stop-color="#ffcf5a"/><stop offset="1" stop-color="#f0a21a"/></linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".9" fill="#fff" opacity=".13"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#3a1004" flood-opacity=".45"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="2" y="2" width="96" height="96" rx="26"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="2" y="8" width="96" height="96" rx="26" fill="url(#base)"/>            <!-- thick button base -->
    <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#face)"/>
    <g clip-path="url(#clip)">
      <rect x="2" y="2" width="96" height="96" fill="url(#dots)"/>
      <rect x="2" y="2" width="96" height="96" fill="url(#light)"/>
      <path d="M2 2 H98 V40 Q50 56 2 40 Z" fill="url(#gloss)" opacity=".55"/>   <!-- glossy top -->
    </g>
    <rect x="3.5" y="3.5" width="93" height="93" rx="24.5" fill="none" stroke="#ffd2b8" stroke-opacity=".7" stroke-width="1.6"/>
  </g>
  <!-- extruded E: dark layers stepping down-right, then the bright face -->
  <g fill="#9e2c0a"><g transform="translate(3.2 3.2)"><rect x="27" y="22" width="13" height="54" rx="5"/><rect x="27" y="22" width="46" height="13" rx="5"/><rect x="27" y="63" width="46" height="13" rx="5"/></g><g transform="translate(2.4 2.4)"><rect x="27" y="22" width="13" height="54" rx="5"/><rect x="27" y="22" width="46" height="13" rx="5"/><rect x="27" y="63" width="46" height="13" rx="5"/></g><g transform="translate(1.6 1.6)"><rect x="27" y="22" width="13" height="54" rx="5"/><rect x="27" y="22" width="46" height="13" rx="5"/><rect x="27" y="63" width="46" height="13" rx="5"/></g></g>
  <g fill="#9e2c0a" stroke="#9e2c0a" transform="translate(3.2 3.2)"><path d="M46 40.5 L70 49 L46 57.5 Z" stroke-width="5" stroke-linejoin="round"/></g>
  <g fill="url(#letter)" stroke="#c84a1c" stroke-width=".8"><rect x="27" y="22" width="13" height="54" rx="5"/><rect x="27" y="22" width="46" height="13" rx="5"/><rect x="27" y="63" width="46" height="13" rx="5"/></g>
  <g filter="url(#glow)"><g fill="url(#gold)" stroke="#ffcf5a"><path d="M46 40.5 L70 49 L46 57.5 Z" stroke-width="5" stroke-linejoin="round"/></g></g>
  <path d="M49.5 45 L58 48" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>
  <rect x="29.5" y="24" width="38" height="3" rx="1.5" fill="#fff" opacity=".9"/>
  <path d="M84 10 Q85.08 14.92 90 16 Q85.08 17.08 84 22 Q82.92 17.08 78 16 Q82.92 14.92 84 10Z" fill="#fff" opacity="0.95"/><path d="M90 25 Q90.54 27.46 93 28 Q90.54 28.54 90 31 Q89.46 28.54 87 28 Q89.46 27.46 90 25Z" fill="#fff" opacity="0.8"/><path d="M14 79.5 Q14.81 83.19 18.5 84 Q14.81 84.81 14 88.5 Q13.19 84.81 9.5 84 Q13.19 83.19 14 79.5Z" fill="#fff" opacity="0.75"/>
</svg>